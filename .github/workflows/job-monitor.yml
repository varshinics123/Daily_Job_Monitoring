name: Job Monitoring

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 12:00 AM IST
    # 12:00 AM IST Monday = 18:30 UTC Sunday
    - cron: '30 18 * * 0'

jobs:
  monitor:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Setup Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # Install dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # Run Job Monitoring
      # ======================================================

      - name: Run Synapse Job Monitoring
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SYNAPSE_ENDPOINT: ${{ secrets.SYNAPSE_ENDPOINT }}

        run: |
          python synapse_Daily_Monitor.py


      # ======================================================
      # Upload CSV report
      # ======================================================

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: synapse-pipeline-results
          path: synapse_pipeline_results.csv
          retention-days: 30
